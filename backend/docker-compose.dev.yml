# ==============================================================================
# Docker Compose - Local Development Environment
# Dịch vụ: PostgreSQL 16 (port 5433), Redis 7 (port 6379), Spring Boot Dev (port 8000, debug 5005)
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: soopi_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soopi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soopi_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-soopi_shop}
    ports:
      - "5433:5432"
    volumes:
      - soopi_shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soopi_user} -d ${POSTGRES_DB:-soopi_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soopi_network

  redis:
    image: redis:7-alpine
    container_name: soopi_shop_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - soopi_shop_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - soopi_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: soopi_shop_backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Hot Reload DevTools
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: "1s"
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: "400ms"
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
      - soopi_shop_m2_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soopi_network

volumes:
  soopi_shop_pgdata:
  soopi_shop_redisdata:
  soopi_shop_m2_cache:

networks:
  soopi_network:
    name: soopi_network
    driver: bridge
