server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: soopi-shop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet

  # ==============================================================================
  # 2. DATABASE SERVICE (PostgreSQL)
  # ==============================================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SoopiShopHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ==============================================================================
  # 3. CACHE SERVICE (Redis)
  # ==============================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 3000ms

  # ==============================================================================
  # 4. AUTH & SECURITY SERVICE (Clerk OAuth2)
  # ==============================================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:}

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
      additional-paths:
        - src/main/java
        - src/main/resources

# ==============================================================================
# CLERK SERVICE CONFIGURATION
# ==============================================================================

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
